networks:
  cms-network:
    driver: bridge

volumes:
  postgres_user_data:
  postgres_content_data:
  rabbitmq_data:
  redis_data:
  elasticsearch_data:
  portainer_data:

services:

  # ── Databases ────────────────────────────────────────────────────────────────

  postgres-user:
    image: postgres:16-alpine
    container_name: postgres-user
    networks: [cms-network]
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_USER_PASSWORD:-postgres}
    volumes:
      - postgres_user_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d user_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-content:
    image: postgres:16-alpine
    container_name: postgres-content
    networks: [cms-network]
    environment:
      POSTGRES_DB: content_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_CONTENT_PASSWORD:-postgres}
    volumes:
      - postgres_content_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d content_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Messaging ────────────────────────────────────────────────────────────────

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    networks: [cms-network]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── Cache ────────────────────────────────────────────────────────────────────

  redis:
    image: redis:7-alpine
    container_name: redis
    networks: [cms-network]
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Observability ────────────────────────────────────────────────────────────

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: elasticsearch
    networks: [cms-network]
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    container_name: kibana
    networks: [cms-network]
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  # ── Distributed Tracing ──────────────────────────────────────────────────────

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: jaeger
    networks: [cms-network]
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  # ── API Gateway ───────────────────────────────────────────────────────────────

  kong:
    image: kong:3.6-ubuntu
    container_name: kong
    networks: [cms-network]
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_LOG_LEVEL: info
    volumes:
      - ./docker/kong/kong.yml:/etc/kong/kong.yml:ro
    ports:
      - "8000:8000"
      - "8001:8001"
    depends_on:
      - user-service
      - content-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/status"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── Container Management ──────────────────────────────────────────────────────

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    networks: [cms-network]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    ports:
      - "9000:9000"

  # ── Microservices ─────────────────────────────────────────────────────────────

  user-service:
    build:
      context: .
      dockerfile: src/UserService/Dockerfile
    container_name: user-service
    networks: [cms-network]
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5002
      - ConnectionStrings__UserDb=Host=postgres-user;Port=5432;Database=user_db;Username=postgres;Password=${POSTGRES_USER_PASSWORD:-postgres}
      - ConnectionStrings__RabbitMq=amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672/
      - ConnectionStrings__Redis=redis:6379
      - Elasticsearch__Uri=http://elasticsearch:9200
      - Jaeger__OtlpEndpoint=http://jaeger:4317
    ports:
      - "5002:5002"
    depends_on:
      postgres-user:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5002/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  content-service:
    build:
      context: .
      dockerfile: src/ContentService/Dockerfile
    container_name: content-service
    networks: [cms-network]
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5001
      - ConnectionStrings__ContentDb=Host=postgres-content;Port=5432;Database=content_db;Username=postgres;Password=${POSTGRES_CONTENT_PASSWORD:-postgres}
      - ConnectionStrings__RabbitMq=amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672/
      - ConnectionStrings__Redis=redis:6379
      - UserService__BaseUrl=http://user-service:5002
      - Elasticsearch__Uri=http://elasticsearch:9200
      - Jaeger__OtlpEndpoint=http://jaeger:4317
    ports:
      - "5001:5001"
    depends_on:
      postgres-content:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      user-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5001/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

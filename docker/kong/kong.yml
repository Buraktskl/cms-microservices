_format_version: "3.0"

services:

  # ── User Service ──────────────────────────────────────────────────────────────
  # PDF'de belirtilen route: /users
  # Controller route:        /api/v1/users
  # Kong, /users/* isteklerini strip edip service URL'nin /api/v1/users/* path'ına iletir.

  - name: user-service
    url: http://user-service:5002/api/v1/users
    routes:
      - name: user-service-route
        paths:
          - /users
        strip_path: true
        methods:
          - GET
          - POST
          - PUT
          - DELETE
    plugins:
      - name: rate-limiting
        config:
          minute: 100
          policy: local
      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Authorization
            - Content-Type
            - X-Correlation-Id
            - Idempotency-Key
          max_age: 3600

  # ── Content Service ───────────────────────────────────────────────────────────
  - name: content-service
    url: http://content-service:5001/api/v1/contents
    routes:
      - name: content-service-route
        paths:
          - /contents
        strip_path: true
        methods:
          - GET
          - POST
          - PUT
          - DELETE
    plugins:
      - name: rate-limiting
        config:
          minute: 100
          policy: local
      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Authorization
            - Content-Type
            - X-Correlation-Id
            - Idempotency-Key
          max_age: 3600

  # ── Swagger UI erişimi ─────────────────────────────────────────────────────────
  - name: user-service-swagger
    url: http://user-service:5002
    routes:
      - name: user-swagger-route
        paths:
          - /users/swagger
        strip_path: true

  - name: content-service-swagger
    url: http://content-service:5001
    routes:
      - name: content-swagger-route
        paths:
          - /contents/swagger
        strip_path: true
